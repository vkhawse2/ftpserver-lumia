name: Build AirTile (Windows 10 Mobile ARM)

# Builds the UWP app on a Windows runner and signs it with a fresh
# self-signed certificate. The package is published as a GitHub Release
# asset because the account's Actions artifact quota is exhausted.

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Create self-signed signing certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=Vishal" `
            -KeyUsage DigitalSignature -FriendlyName "FtpServer" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pwd = ConvertTo-SecureString -String "ftpserver" -Force -AsPlainText
          Export-PfxCertificate -cert $cert -FilePath "$env:GITHUB_WORKSPACE\FtpServer_TemporaryKey.pfx" -Password $pwd
          Export-Certificate -cert $cert -FilePath "$env:GITHUB_WORKSPACE\FtpServer.cer"
          echo "THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Restore NuGet packages
        run: nuget restore FtpServerLumia.sln

      - name: Build ARM Release package
        run: >
          msbuild FtpServerLumia.sln /p:Configuration=Release /p:Platform=ARM
          /p:AppxPackageDir="$env:GITHUB_WORKSPACE\AppPackages\"
          /p:AppxBundle=Always
          /p:AppxBundlePlatforms=ARM
          /p:UapAppxPackageBuildMode=SideloadOnly
          /p:PackageCertificateKeyFile="$env:GITHUB_WORKSPACE\FtpServer_TemporaryKey.pfx"
          /p:PackageCertificatePassword=ftpserver
          /p:PackageCertificateThumbprint=$env:THUMBPRINT
          /p:GenerateAppxPackageOnBuild=true

      - name: Publish package as release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem -Recurse AppPackages -Include *.appxbundle, *.appx |
            Select-Object -ExpandProperty FullName
          $files += "$env:GITHUB_WORKSPACE\FtpServer.cer"
          Compress-Archive -Path $files -DestinationPath "$env:GITHUB_WORKSPACE\FtpServer-W10M.zip"
          $tag = "v1.0.$env:GITHUB_RUN_NUMBER"
          gh release create $tag "$env:GITHUB_WORKSPACE\FtpServer-W10M.zip" `
            --title "AirTile build $env:GITHUB_RUN_NUMBER" `
            --notes "Automated ARM build for Windows 10 Mobile 14393. Zip contains the .appxbundle, dependency .appx files and FtpServer.cer (install the .cer first)."
